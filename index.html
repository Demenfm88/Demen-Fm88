<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radio Demen FM</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(160deg, #071b38, #00796b);
  color: white;
  text-align: center;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}
.radio {
  padding: 30px 20px;
  width: 85%;
  max-width: 380px;
  border-radius: 25px;
  background: #ffffff18;
  box-shadow: 0 8px 30px #0005;
}
.logo {
  font-size: 65px;
}
h1 {
  font-size: 30px;
  margin-bottom: 5px;
}
p {
  color: #d7fff6;
}
button {
  background: #00d4a0;
  color: #00251d;
  border: none;
  border-radius: 30px;
  padding: 15px 35px;
  font-size: 18px;
  font-weight: bold;
  margin-top: 20px;
}
audio {
  width: 100%;
  margin-top: 20px;
}
</style>
</head>
<body>
<div class="radio">
  <div class="logo">📻</div>
  <h1>DEMEN FM</h1>
  <p>Emang Ndemenin</p>
  <p>Radio online Anda</p>
  <audio controls preload="none">
    <source src="GANTI_DENGAN_URL_STREAMING_RADIO" type="audio/mpeg">
    Browser tidak mendukung pemutar audio.
  </audio>
  <p>Musik, hiburan, dan informasi</p>
</div>
</body>
</html>
